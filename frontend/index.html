<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SharedGuard — Accountable Delegation &amp; Session Attribution | Review 2 Prototype (70%)</title>
  <meta name="description" content="Review 2 working prototype (70% milestone) for the Shared-Account Elimination Workflow project demonstrating accountable delegation, session attribution, explanation layer, and human fallback review." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Chart.js (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <style>
    /* ===== CSS Design System ===== */
    :root {
      --bg-base:       #090d16;
      --bg-surface:    #0f172a;
      --bg-card:       #172033;
      --bg-card-hover: #1e2942;
      --bg-input:      #0e1626;

      --accent-blue:   #3b82f6;
      --accent-cyan:   #06b6d4;
      --accent-green:  #10b981;
      --accent-amber:  #f59e0b;
      --accent-red:    #ef4444;
      --accent-purple: #8b5cf6;
      --accent-indigo: #6366f1;

      --text-primary:   #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted:     #64748b;

      --border:        #1e293b;
      --border-bright: #334155;

      --radius-sm: 6px;
      --radius:    10px;
      --radius-lg: 16px;

      --shadow-card: 0 4px 24px rgba(0,0,0,0.4);
      --shadow-glow: 0 0 24px rgba(59,130,246,0.15);

      --font-sans: 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13.5px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    #root { display: flex; min-height: 100vh; }

    /* ===== Sidebar ===== */
    .sidebar {
      width: 250px;
      min-height: 100vh;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 100;
      overflow-y: auto;
    }

    .sidebar-logo {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 16px rgba(59,130,246,0.3);
    }

    .logo-text {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #60a5fa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-sub {
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .sidebar-nav {
      padding: 12px 10px;
      flex: 1;
    }

    .nav-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      padding: 10px 12px 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all var(--transition);
      margin-bottom: 2px;
    }

    .nav-item:hover {
      background: rgba(255,255,255,0.04);
      color: var(--text-primary);
    }

    .nav-item.active {
      background: rgba(59,130,246,0.12);
      border-color: rgba(59,130,246,0.3);
      color: #93c5fd;
      font-weight: 600;
    }

    .nav-icon {
      font-size: 15px;
      width: 20px;
      text-align: center;
    }

    .nav-badge {
      margin-left: auto;
      background: rgba(239,68,68,0.2);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 99px;
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
    }

    .sidebar-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
    }

    .review-badge {
      background: rgba(16,185,129,0.08);
      border: 1px solid rgba(16,185,129,0.25);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
    }

    .rb-title {
      font-size: 11px;
      font-weight: 700;
      color: #34d399;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .rb-sub {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* ===== Main Content ===== */
    .main-content {
      margin-left: 250px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg-base);
    }

    .topbar {
      height: 60px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .topbar-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 4px 12px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
    }

    .page-content {
      padding: 28px;
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* ===== Page Header ===== */
    .page-header {
      margin-bottom: 24px;
    }

    .page-header h1 {
      font-size: 23px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 4px;
      letter-spacing: -0.02em;
    }

    .page-header p {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .breadcrumb span { color: var(--text-secondary); }

    /* ===== Cards ===== */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-card);
      transition: border-color var(--transition);
      margin-bottom: 20px;
    }

    .card:hover {
      border-color: var(--border-bright);
    }

    .card-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ===== Stat Cards Grid ===== */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent-color, var(--accent-blue));
    }

    .stat-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
      border-color: var(--border-bright);
    }

    .stat-icon {
      font-size: 20px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.1;
      margin-bottom: 3px;
    }

    .stat-label {
      font-size: 11.5px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* ===== Tables ===== */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    thead th {
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: rgba(15,23,42,0.6);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background var(--transition);
    }

    tbody tr:hover { background: rgba(255,255,255,0.03); }

    tbody td {
      padding: 11px 14px;
      color: var(--text-secondary);
      vertical-align: middle;
    }

    .mono {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--accent-cyan);
    }

    /* ===== Badges ===== */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    .badge-critical { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
    .badge-high     { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.25); }
    .badge-medium   { background: rgba(59,130,246,0.15); color: #60a5fa; border: 1px solid rgba(59,130,246,0.25); }
    .badge-low      { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.25); }

    .badge-active   { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.25); }
    .badge-closed   { background: rgba(100,116,139,0.2); color: #94a3b8; border: 1px solid rgba(100,116,139,0.3); }
    .badge-revoked  { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .badge-expired  { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }

    .badge-attributed    { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .badge-unattributed  { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .badge-denied        { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
    .badge-blocked       { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.4); }
    .badge-uncertain     { background: rgba(139,92,246,0.18); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.4); }
    .badge-confirmed     { background: rgba(6,182,212,0.18); color: #67e8f9; border: 1px solid rgba(6,182,212,0.4); }

    .badge-l1 { background: rgba(148,163,184,0.15); color: #cbd5e1; border: 1px solid rgba(148,163,184,0.3); }
    .badge-l2 { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.3); }
    .badge-l3 { background: rgba(139,92,246,0.15); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.3); }
    .badge-l4 { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }

    /* ===== Form Inputs & Buttons ===== */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-select, .form-input, .form-textarea {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition);
    }

    .form-select:focus, .form-input:focus, .form-textarea:focus {
      border-color: var(--accent-blue);
    }

    .form-textarea {
      resize: vertical;
      min-height: 70px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all var(--transition);
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: #fff;
    }
    .btn-primary:hover {
      background: #2563eb;
      box-shadow: 0 0 16px rgba(59,130,246,0.4);
    }

    .btn-danger {
      background: rgba(239,68,68,0.2);
      color: #f87171;
      border-color: rgba(239,68,68,0.3);
    }
    .btn-danger:hover {
      background: rgba(239,68,68,0.3);
      border-color: #ef4444;
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--text-secondary);
    }
    .btn-outline:hover {
      border-color: var(--border-bright);
      color: var(--text-primary);
      background: rgba(255,255,255,0.03);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 11.5px;
    }

    /* ===== Grid Layouts ===== */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px; }

    /* ===== Filters Bar ===== */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: var(--radius);
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .filter-select {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-radius: var(--radius-sm);
      padding: 4px 10px;
      font-size: 12px;
      outline: none;
    }

    /* ===== Modal & Drawers ===== */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 650px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header h3 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
    }
    .modal-close:hover { color: var(--text-primary); }

    .modal-body {
      padding: 22px;
      flex: 1;
    }

    .modal-footer {
      padding: 14px 22px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* ===== Explanation Box ===== */
    .explanation-box {
      background: #090e1a;
      border: 1px solid var(--border-bright);
      border-radius: var(--radius);
      padding: 16px;
      font-size: 12.5px;
      margin-top: 14px;
    }

    .exp-field {
      display: flex;
      margin-bottom: 6px;
    }

    .exp-label {
      width: 150px;
      color: var(--text-muted);
      font-weight: 600;
      flex-shrink: 0;
    }

    .exp-val {
      color: var(--text-primary);
      flex: 1;
    }

    .checklist-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 5px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    /* ===== Scenario Cards ===== */
    .scenario-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .scenario-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: left;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .scenario-btn:hover {
      border-color: var(--accent-blue);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .scenario-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .scenario-desc {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .scenario-tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent-cyan);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* ===== Chart Container ===== */
    .chart-container {
      position: relative;
      height: 220px;
    }

    /* ===== Loading & Alert ===== */
    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-muted);
      gap: 12px;
    }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.08);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      font-size: 13px;
    }

    .alert-info    { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.25); color: #93c5fd; }
    .alert-warn    { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.25); color: #fcd34d; }
    .alert-success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.25); color: #6ee7b7; }
    .alert-danger  { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; }

    @media (max-width: 900px) {
      .sidebar { width: 200px; }
      .main-content { margin-left: 200px; }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* Auto-detect backend port (checks 8001 then 8000) */
let activeApiUrl = "http://localhost:8001";

async function detectApi() {
  for (const url of ["http://localhost:8001", "http://localhost:8000"]) {
    try {
      const r = await fetch(`${url}/health`, { signal: AbortSignal.timeout(1200) });
      if (r.ok) {
        activeApiUrl = url;
        return url;
      }
    } catch (e) {}
  }
  return "http://localhost:8001";
}

async function apiFetch(path, options = {}) {
  const res = await fetch(`${activeApiUrl}${path}`, options);
  if (!res.ok) {
    const err = await res.json().catch(() => ({ detail: `HTTP ${res.status}` }));
    throw new Error(err.detail || `HTTP ${res.status}`);
  }
  return await res.json();
}

function useApi(path, trigger = 0) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    setLoading(true);
    setError(null);
    detectApi().then(() => {
      apiFetch(path)
        .then(d => { setData(d); setLoading(false); })
        .catch(e => { setError(e.message); setLoading(false); });
    });
  }, [path, trigger]);

  return { data, loading, error };
}

function PermBadge({ level }) {

function StatusBadge({ status }) {

  if (s === 'active') return <span className="badge badge-active">● Active</span>;
  if (s === 'revoked') return <span className="badge badge-revoked">✗ Revoked</span>;

function AttributionBadge({ status }) {
  if (status === 'ATTRIBUTED') return <span className="badge badge-attributed">✓ ATTRIBUTED</span>;
  if (status === 'UNATTRIBUTED') return <span className="badge badge-unattributed">✗ UNATTRIBUTED</span>;

  if (status === 'BLOCKED') return <span className="badge badge-blocked">🛑 BLOCKED</span>;

}

/* Charts */
function DoughnutChart({ dataMap, labels, colors }) {
  const ref = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    const ctx = ref.current.getContext('2d');
    chartRef.current = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: labels.map(l => dataMap[l] || 0),
          backgroundColor: colors,
          borderColor: '#172033',
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '68%',
        plugins: {
          legend: { position: 'bottom', labels: { color: '#94a3b8', font: { family: 'Inter', size: 11 } } }
        }
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [dataMap]);

  return <div className="chart-container"><canvas ref={ref}></canvas></div>;
}

function BarChart({ dataMap, title }) {
  const ref = useRef(null);
  const chartRef = useRef(null);

  useEffect(() => {
    if (!ref.current) return;
    if (chartRef.current) chartRef.current.destroy();
    const ctx = ref.current.getContext('2d');
    const labels = Object.keys(dataMap);
    chartRef.current = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: title,
          data: labels.map(l => dataMap[l]),
          backgroundColor: '#3b82f6',
          borderRadius: 4,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { display: false } },
          y: { ticks: { color: '#94a3b8', font: { size: 11 } }, grid: { color: 'rgba(255,255,255,0.05)' } }
        }
      }
    });
    return () => { if (chartRef.current) chartRef.current.destroy(); };
  }, [dataMap]);

  return <div className="chart-container"><canvas ref={ref}></canvas></div>;
}

function Delegation({ onSessionCreated }) {
  const { data: users } = useApi('/users/?active_only=true');
  const { data: accounts } = useApi('/shared-accounts/');

  const [selectedUser, setSelectedUser] = useState('USER012');
  const [selectedAccount, setSelectedAccount] = useState('SACC001');
  const [duration, setDuration] = useState(30);
  const [justification, setJustification] = useState('Review 2 live accountable delegation session');
  const [result, setResult] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  const activeUserObj = users?.find(u => u.user_id === selectedUser);
  const activeAccObj  = accounts?.find(a => a.shared_account_id === selectedAccount);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setSubmitting(true);
    setResult(null);
    try {
      const res = await apiFetch('/sessions/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: selectedUser,
          shared_account_id: selectedAccount,
          duration_minutes: parseInt(duration),
          justification
        })
      });
      setResult(res);
      if (res.status === 'SUCCESS' && onSessionCreated) {
        onSessionCreated();
      }
    } catch (err) {
      setResult({ status: 'ERROR', message: err.message });
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div>
      <div className="page-header">
        <div className="breadcrumb">SharedGuard <span>›</span> Delegation Workflow</div>

              <label className="form-label">2. Target Shared Account</label>
              <select className="form-select" value={selectedAccount} onChange={e => setSelectedAccount(e.target.value)}>
                {(accounts || []).map(a => (
                  <option key={a.shared_account_id} value={a.shared_account_id}>
                    {a.account_name} ({a.shared_account_id}) — {a.application_name} [{a.risk_level} Risk]

            <button type="submit" className="btn btn-primary" style={{ width: '100%' }} disabled={submitting}>

                    <td style={{ fontSize: 11, fontFamily: 'var(--font-mono)' }}>{s.end_time?.replace('T', ' ') || 'N/A'}</td>
                    <td><StatusBadge status={s.status} /></td>
                    <td>
                      {s.status === 'active' ? (
                        <button
                          className="btn btn-danger btn-sm"
                          disabled={revokingId === s.session_id}
                          onClick={() => handleRevoke(s.session_id)}
                        >
                          {revokingId === s.session_id ? 'Revoking…' : 'Revoke'}
                        </button>
                      ) : (
                        <span style={{ fontSize: 11, color: 'var(--text-muted)' }}>Immutable</span>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function ActionSimulator({ onActionExecuted }) {
  const { data: activeSessions } = useApi('/sessions/active');
  const [selectedSession, setSelectedSession] = useState('');
  const [actionType, setActionType] = useState('Modify configuration');
  const [sensitivity, setSensitivity] = useState('HIGH');
  const [justification, setJustification] = useState('Routine system maintenance');
  const [executionResult, setExecutionResult] = useState(null);
  const [executing, setExecuting] = useState(false);

  useEffect(() => {
    if (activeSessions && activeSessions.length > 0 && !selectedSession) {
      setSelectedSession(activeSessions[0].session_id);
    }
  }, [activeSessions]);

  const runAction = async (payload) => {
    setExecuting(true);
    setExecutionResult(null);
    try {
      const res = await apiFetch('/actions/perform', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      setExecutionResult(res);
      if (onActionExecuted) onActionExecuted();
    } catch (err) {
      setExecutionResult({ status: 'ERROR', reason: err.message });
    } finally {
      setExecuting(false);
    }
  };

  const handleCustomSubmit = (e) => {
    e.preventDefault();
    runAction({
      session_id: selectedSession || null,
      action: actionType,
      sensitivity,
      justification
    });
  };

  const runScenarioTrigger = async (scenarioKey) => {
    setExecuting(true);
    setExecutionResult(null);
    try {
      const res = await apiFetch(`/scenarios/trigger/${scenarioKey}`, { method: 'POST' });
      setExecutionResult(res.execution_trace);
      if (onActionExecuted) onActionExecuted();
    } catch (err) {
      setExecutionResult({ status: 'ERROR', reason: err.message });
    } finally {
      setExecuting(false);
    }
  };

  return (
    <div>
      <div className="page-header">
        <div className="breadcrumb">SharedGuard <span>›</span> Privileged Action Simulator</div>
        <h1>⚡ Sensitive Action Simulator &amp; Failure Cases</h1>

        <button className="scenario-btn" onClick={() => runScenarioTrigger('missing_delegation')}>
          <div>
            <div className="scenario-title">🔴 Edge Case 1: Missing Delegation</div>
            <div className="scenario-desc">Action attempted directly against shared account without any delegation token.</div>
          </div>
          <div className="scenario-tag">Expected: BLOCKED (Unattributed) ›</div>
        </button>

        <button className="scenario-btn" onClick={() => runScenarioTrigger('insufficient_permission')}>
          <div>
            <div className="scenario-title">🔴 Edge Case 2: Insufficient Permission</div>
            <div className="scenario-desc">Low-level operator (L1) attempts high-risk administrative change (L4).</div>
          </div>
          <div className="scenario-tag">Expected: PERMISSION DENIED ›</div>

        <button className="scenario-btn" onClick={() => runScenarioTrigger('expired_session')}>
          <div>
            <div className="scenario-title">🔴 Edge Case 3: Expired Session</div>
            <div className="scenario-desc">Action attempted after delegation session time-bound window has elapsed.</div>
          </div>
          <div className="scenario-tag">Expected: BLOCKED (Session Expired) ›</div>

          <div>
            <div className="scenario-title">🔴 Edge Case 4: Invalid Session</div>

        {/* Live Execution & Explanation Result Card */}
        <div>

function HumanReviewQueue({ trigger, onResolved }) {
  const [statusFilter, setStatusFilter] = useState('ALL');
  const { data: cases, loading, error } = useApi(`/reviews/?status=${statusFilter}`, trigger);
  const [activeReviewCase, setActiveReviewCase] = useState(null);
  const [reviewerId, setReviewerId] = useState('AUDITOR001');
  const [decision, setDecision] = useState('CONFIRMED');
  const [reason, setReason] = useState('Corroborated by physical access log and dual authorization ticket.');
  const [submitting, setSubmitting] = useState(false);

  const handleDecisionSubmit = async (e) => {
    e.preventDefault();
    if (!activeReviewCase) return;
    setSubmitting(true);
    try {
      await apiFetch(`/reviews/${activeReviewCase.review_id}/decide`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          reviewer_id: reviewerId,
          decision: decision,
          reason: reason
        })
      });
      setActiveReviewCase(null);
      if (onResolved) onResolved();
    } catch (err) {
      alert(`Decision error: ${err.message}`);
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div>
      <div className="page-header">
        <div className="breadcrumb">SharedGuard <span>›</span> Fallback Workflow</div>

            <option value="PENDING">Pending Review</option>

            <option value="UNATTRIBUTED">Ruled Unattributed</option>

                  <th>Action ID</th>
                  <th>Session ID</th>
                  <th>Shared Account</th>

                  <th>Conflicting Evidence</th>
                  <th>Status</th>
                  <th>Adjudication</th>

              </thead>
              <tbody>
                {cases.map(c => (
                  <tr key={c.review_id}>
                    <td><strong className="mono">{c.review_id}</strong></td>
                    <td><span className="mono">{c.action_id}</span></td>

                        <span className="badge badge-confirmed">✓ CONFIRMED</span>
                      ) : (
                        <span className="badge badge-unattributed">✗ UNATTRIBUTED</span>
                      )}
                    </td>
                    <td>
                      {c.review_status === 'PENDING' ? (
                        <button className="btn btn-primary btn-sm" onClick={() => setActiveReviewCase(c)}>
                          Adjudicate
                        </button>
                      ) : (

                        </span>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

      {/* Adjudication Modal */}
      {activeReviewCase && (

              </div>

  );
}

/* =========================================================================
   10. EVALUATION & BENCHMARKS (Part 15)
   ========================================================================= */
function EvaluationBenchmarks({ trigger, onRerun }) {
  const { data: results, loading, error } = useApi('/evaluation/results', trigger);
  const [running, setRunning] = useState(false);

  const handleRunEvaluation = async () => {
    setRunning(true);
    try {
      await apiFetch('/evaluation/run', { method: 'POST' });
      if (onRerun) onRerun();
    } catch (e) {
      alert(`Evaluation error: ${e.message}`);
    } finally {
      setRunning(false);
    }
  };

  return (
    <div>
      <div className="page-header">
        <div className="breadcrumb">SharedGuard <span>›</span> Empirical Benchmarks</div>
        <h1>🧪 Reproducible Synthetic Evaluation</h1>
        <p>Benchmark measurements persisted dynamically in <code>evaluation_results.json</code> directly from SQLite evidence.</p>
      </div>

      <div style={{ marginBottom: 16 }}>
        <button className="btn btn-primary" onClick={handleRunEvaluation} disabled={running}>
          {running ? 'Re-evaluating Benchmark…' : '🔄 Re-run Benchmark Evaluation from Database'}
        </button>
      </div>

      {loading && <Spinner />}
      {error && <ErrorBox message={error} />}
      {results && (
        <div>
          <div className="grid-3">
            <div className="card">
              <div className="card-title">Legacy Baseline IAR</div>
              <div style={{ fontSize: 32, fontWeight: 800, color: '#ef4444' }}>
                {results.metrics_summary?.baseline_iar}%
              </div>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>
                Total Legacy Logs: {results.baseline?.total_system_logs}
              </div>
            </div>

            <div className="card">
              <div className="card-title">Prototype IAR</div>
              <div style={{ fontSize: 32, fontWeight: 800, color: '#10b981' }}>
                {results.metrics_summary?.prototype_iar}%
              </div>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>
                Total Actions: {results.prototype?.total_actions}
              </div>
            </div>

            <div className="card">
              <div className="card-title">Forensic Improvement</div>
              <div style={{ fontSize: 32, fontWeight: 800, color: '#06b6d4' }}>
                +{results.metrics_summary?.improvement}%
              </div>
              <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>
                Target: &gt;80% non-repudiation
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-title">Detailed Evaluation Data Table</div>
            <div className="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>Metric Attribute</th>
                    <th>Legacy Baseline System</th>
                    <th>Review 2 Prototype</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>Total Evaluated Actions</td>
                    <td>{results.baseline?.total_system_logs}</td>
                    <td>{results.prototype?.total_actions}</td>
                  </tr>
                  <tr>
                    <td>Sensitive Actions Evaluated</td>
                    <td>{results.baseline?.sensitive_actions}</td>
                    <td>{results.prototype?.sensitive_actions}</td>
                  </tr>
                  <tr>
                    <td>Individually Attributed Actions</td>
                    <td><span className="badge badge-unattributed">0</span></td>
                    <td><span className="badge badge-attributed">{results.prototype?.individually_attributed}</span></td>
                  </tr>
                  <tr>
                    <td>Unattributed Actions</td>
                    <td>{results.baseline?.unattributed}</td>
                    <td>{results.prototype?.unattributed}</td>
                  </tr>
                  <tr>
                    <td>Permission Denied Interceptions</td>
                    <td>0 (No checks)</td>
                    <td>{results.prototype?.permission_denied}</td>
                  </tr>
                  <tr>
                    <td>Blocked / Revoked Interceptions</td>
                    <td>0</td>
                    <td>{results.prototype?.blocked_actions}</td>
                  </tr>
                  <tr>
                    <td>Individual Attribution Rate (IAR)</td>
                    <td><strong>0.0%</strong></td>
                    <td><strong style={{ color: '#10b981' }}>{results.metrics_summary?.prototype_iar}%</strong></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

  );
}

/* Main App */
function App() {
  const [activePage, setActivePage] = useState('dashboard');
  const [backendOnline, setBackendOnline] = useState(null);
  const [apiPort, setApiPort] = useState('8001');
  const [trigger, setTrigger] = useState(0);

  const refreshData = () => setTrigger(t => t + 1);

  useEffect(() => {
    detectApi().then(url => {
      setApiPort(url.includes('8000') ? '8000' : '8001');
      fetch(`${url}/health`)
        .then(r => setBackendOnline(r.ok))
        .catch(() => setBackendOnline(false));
    });
  }, [trigger]);

  return (
    <>
      <nav className="sidebar">
        <div className="sidebar-logo">
          <div className="logo-badge">
            <div className="logo-icon">🛡️</div>
            <div>
              <div className="logo-text">SharedGuard</div>
              <div className="logo-sub">Review 2 (70% Target)</div>
            </div>
          </div>
        </div>

        <div className="sidebar-nav">
          <div className="nav-section-label">Core Review 2 Pages</div>
          {PAGES.map(p => (
            <button
              key={p.id}
              className={`nav-item ${activePage === p.id ? 'active' : ''}`}
              onClick={() => setActivePage(p.id)}
            >
              <span className="nav-icon">{p.icon}</span>
              {p.label}
              {p.id === 'human-review' && <span className="nav-badge">Queue</span>}
            </button>
          ))}
        </div>

        <div className="sidebar-footer">
          <div className="review-badge">
            <div className="rb-title">Review 2 Milestone</div>
            <div className="rb-sub">Completion: 70% Progress</div>
          </div>
        </div>
      </nav>

      <div className="main-content">
        <header className="topbar">
          <div className="topbar-left">
            <div className="topbar-title">{PAGES.find(p => p.id === activePage)?.label}</div>
          </div>
          <div className="topbar-right">
            <div className="status-dot">
              <div className="dot" style={{
                background: backendOnline === null ? '#f59e0b' : backendOnline ? '#10b981' : '#ef4444'
              }}></div>
              {backendOnline === null ? 'Checking Backend…' : backendOnline ? `FastAPI Online (Port ${apiPort})` : 'Backend Offline'}
            </div>
          </div>
        </header>

        <main className="page-content">
          {activePage === 'dashboard'       && <Dashboard />}
          {activePage === 'users'           && <Users />}
          {activePage === 'shared-accounts' && <SharedAccounts />}
          {activePage === 'delegation'      && <Delegation onSessionCreated={refreshData} />}
          {activePage === 'sessions'        && <ActiveSessions trigger={trigger} onRevoke={refreshData} />}
          {activePage === 'simulator'       && <ActionSimulator onActionExecuted={refreshData} />}
          {activePage === 'audit-log'       && <AuditLog trigger={trigger} />}
          {activePage === 'human-review'    && <HumanReviewQueue trigger={trigger} onResolved={refreshData} />}
          {activePage === 'comparison'      && <BaselineComparison />}
          {activePage === 'evaluation'      && <EvaluationBenchmarks trigger={trigger} onRerun={refreshData} />}
          {activePage === 'demo'            && <DemoGuide onNavigate={p => setActivePage(p)} />}
        </main>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
